# The iPhone app. Generate the Xcode project with `xcodegen` in this folder; it uses the repo's NotchbanCore package.
name: Notchban
options:
  bundleIdPrefix: com.opsidatech
  deploymentTarget:
    iOS: "17.0"
packages:
  NotchbanCore:
    path: ..
targets:
  Notchban:
    type: application
    platform: iOS
    sources: [Notchban]
    dependencies:
      - package: NotchbanCore
        product: NotchbanCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.opsidatech.notchban.ios
        PRODUCT_NAME: Notchban
        MARKETING_VERSION: 0.2.7
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: KT2Z279LC8
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        OTHER_SWIFT_FLAGS: "-enable-bare-slash-regex"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Notchban/Info.plist
      properties:
        CFBundleDisplayName: Notchban
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: 2026 Özgün Kasap
        NSLocalNetworkUsageDescription: Notchban talks to your paired Mac over Wi-Fi or Bluetooth to show your boards, with no server in between.
        NSBonjourServices: [_notchban._tcp, _notchban._udp]
        NSCameraUsageDescription: Notchban reads the pairing code your Mac shows. Nothing is recorded or kept.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        UIViewControllerBasedStatusBarAppearance: false
        UIStatusBarStyle: UIStatusBarStyleLightContent
